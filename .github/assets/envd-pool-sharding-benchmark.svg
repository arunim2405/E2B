<svg xmlns="http://www.w3.org/2000/svg" aria-labelledby="title description" role="img" viewBox="0 0 1200 560"><title id="title">Envd HTTP/2 pool sharding benchmark</title><desc id="description">Two line charts compare one, four, and eight Python SDK envd connection pools at 50, 100, 200, and 400 concurrent long-lived streams. One pool stops at 100 streams, four pools reach 398 at 400, and eight pools reach all 400 before the 750 millisecond deadline.</desc><style>:root{color-scheme:light dark}.background{fill:#fff}.frame,.grid{stroke-width:1}.frame{fill:none;stroke:#d0d7de}.grid{stroke:#d8dee4}.axis{fill:#57606a;font:13px ui-sans-serif,system-ui,sans-serif}.heading{fill:#1f2328;font:700 24px ui-sans-serif,system-ui,sans-serif}.subtitle{fill:#57606a;font:14px ui-sans-serif,system-ui,sans-serif}.legend{fill:#1f2328}.panel-title{fill:#1f2328;font:650 16px ui-sans-serif,system-ui,sans-serif}.legend{font:14px ui-sans-serif,system-ui,sans-serif}.note{fill:#57606a;font:12px ui-sans-serif,system-ui,sans-serif}.eight,.four,.one{fill:none;stroke-width:3}.one{stroke:#0969da}.four{stroke:#bf6a02}.eight{stroke:#1a7f37}.one-dot{fill:#0969da}.four-dot{fill:#bf6a02}.eight-dot{fill:#1a7f37}.deadline{stroke:#8c959f;stroke-width:1.5;stroke-dasharray:6 5}.value{fill:#1f2328;font:650 13px ui-sans-serif,system-ui,sans-serif}.one-value{fill:#0969da}.four-value{fill:#bf6a02}.eight-value{fill:#1a7f37}.four-timeout,.one-timeout{stroke-width:2}.one-timeout{stroke:#0969da}.four-timeout{stroke:#bf6a02}@media (prefers-color-scheme:dark){.background{fill:#0d1117}.frame,.grid{stroke:#30363d}.heading,.legend,.panel-title,.value{fill:#e6edf3}.axis,.note,.subtitle{fill:#8b949e}.one{stroke:#58a6ff}.four{stroke:#d29922}.eight{stroke:#3fb950}.one-dot{fill:#58a6ff}.four-dot{fill:#d29922}.eight-dot{fill:#3fb950}.deadline{stroke:#6e7681}.one-value{fill:#58a6ff}.four-value{fill:#d29922}.eight-value{fill:#3fb950}.one-timeout{stroke:#58a6ff}.four-timeout{stroke:#d29922}}</style><rect width="1200" height="560" class="background"/><text x="52" y="46" class="heading">Envd HTTP/2 pool sharding</text><text x="52" y="72" class="subtitle">Python SDK · local peer advertising 100 concurrent streams per connection · three-run median</text><g transform="translate(755 39)"><line x1="0" x2="28" y1="0" y2="0" class="one"/><text x="38" y="5" class="legend">1 pool</text><line x1="112" x2="140" y1="0" y2="0" class="four"/><text x="150" y="5" class="legend">4 pools (default)</text><line x1="300" x2="328" y1="0" y2="0" class="eight"/><text x="338" y="5" class="legend">8 pools</text></g><text x="68" y="112" class="panel-title">Streams opened before the 750 ms deadline</text><rect width="486" height="300" x="76" y="132" class="frame"/><line x1="76" x2="562" y1="357" y2="357" class="grid"/><line x1="76" x2="562" y1="282" y2="282" class="grid"/><line x1="76" x2="562" y1="207" y2="207" class="grid"/><line x1="76" x2="562" y1="132" y2="132" class="grid"/><text x="64" y="436" class="axis" text-anchor="end">0</text><text x="64" y="361" class="axis" text-anchor="end">100</text><text x="64" y="286" class="axis" text-anchor="end">200</text><text x="64" y="211" class="axis" text-anchor="end">300</text><text x="64" y="136" class="axis" text-anchor="end">400</text><text x="84" y="454" class="axis" text-anchor="middle">50</text><text x="152" y="454" class="axis" text-anchor="middle">100</text><text x="291" y="454" class="axis" text-anchor="middle">200</text><text x="554" y="454" class="axis" text-anchor="middle">400</text><text x="319" y="482" class="axis" text-anchor="middle">Concurrent long-lived streams requested</text><text class="axis" text-anchor="middle" transform="translate(22 282) rotate(-90)">Streams opened</text><polyline points="84 394.5 152 357 291 357 554 357" class="one"/><polyline points="84 394.5 152 357 291 282 554 133.5" class="four"/><polyline points="84 394.5 152 357 291 282 554 132" class="eight"/><g><circle cx="84" cy="394.5" r="4" class="one-dot"/><circle cx="152" cy="357" r="4" class="one-dot"/><circle cx="291" cy="357" r="4" class="one-dot"/><circle cx="554" cy="357" r="4" class="one-dot"/><circle cx="84" cy="394.5" r="4" class="four-dot"/><circle cx="152" cy="357" r="4" class="four-dot"/><circle cx="291" cy="282" r="4" class="four-dot"/><circle cx="554" cy="133.5" r="4" class="four-dot"/><circle cx="84" cy="394.5" r="4" class="eight-dot"/><circle cx="152" cy="357" r="4" class="eight-dot"/><circle cx="291" cy="282" r="4" class="eight-dot"/><circle cx="554" cy="132" r="4" class="eight-dot"/></g><text x="538" y="118" class="value eight-value" text-anchor="end">400 / 400</text><text x="538" y="153" class="value four-value" text-anchor="end">398 / 400</text><text x="538" y="348" class="value one-value" text-anchor="end">100 / 400</text><text x="638" y="112" class="panel-title">Time to completion or deadline</text><rect width="486" height="300" x="646" y="132" class="frame"/><line x1="646" x2="1132" y1="357" y2="357" class="grid"/><line x1="646" x2="1132" y1="282" y2="282" class="grid"/><line x1="646" x2="1132" y1="207" y2="207" class="grid"/><line x1="646" x2="1132" y1="132" y2="132" class="grid"/><line x1="646" x2="1132" y1="151" y2="151" class="deadline"/><text x="1124" y="144" class="note" text-anchor="end">750 ms deadline</text><text x="634" y="436" class="axis" text-anchor="end">0</text><text x="634" y="361" class="axis" text-anchor="end">200</text><text x="634" y="286" class="axis" text-anchor="end">400</text><text x="634" y="211" class="axis" text-anchor="end">600</text><text x="634" y="136" class="axis" text-anchor="end">800</text><text x="654" y="454" class="axis" text-anchor="middle">50</text><text x="722" y="454" class="axis" text-anchor="middle">100</text><text x="861" y="454" class="axis" text-anchor="middle">200</text><text x="1124" y="454" class="axis" text-anchor="middle">400</text><text x="889" y="482" class="axis" text-anchor="middle">Concurrent long-lived streams requested</text><text class="axis" text-anchor="middle" transform="translate(592 282) rotate(-90)">Elapsed time (ms)</text><polyline points="654 427.1 722 422.1 861 145.8 1124 140.2" class="one"/><polyline points="654 425.4 722 419.6 861 413.9 1124 143.9" class="four"/><polyline points="654 425 722 420.4 861 409.9 1124 396" class="eight"/><g><circle cx="654" cy="427.1" r="4" class="one-dot"/><circle cx="722" cy="422.1" r="4" class="one-dot"/><circle cx="861" cy="145.8" r="4" class="one-dot"/><circle cx="1124" cy="140.2" r="4" class="one-dot"/><circle cx="654" cy="425.4" r="4" class="four-dot"/><circle cx="722" cy="419.6" r="4" class="four-dot"/><circle cx="861" cy="413.9" r="4" class="four-dot"/><circle cx="1124" cy="143.9" r="4" class="four-dot"/><circle cx="654" cy="425" r="4" class="eight-dot"/><circle cx="722" cy="420.4" r="4" class="eight-dot"/><circle cx="861" cy="409.9" r="4" class="eight-dot"/><circle cx="1124" cy="396" r="4" class="eight-dot"/></g><g aria-label="Timed out before every requested stream opened"><path d="M856 140.8l10 10m0-10l-10 10" class="one-timeout"/><path d="M1119 135.2l10 10m0-10l-10 10" class="one-timeout"/><path d="M1119 138.9l10 10m0-10l-10 10" class="four-timeout"/></g><text x="1112" y="387" class="value" text-anchor="end">96 ms</text><text x="1124" y="505" class="note" text-anchor="end">× deadline reached before the full batch opened</text><text x="52" y="530" class="note">Sync and async produced the same capacity. Elapsed time is the median of their three-run medians; open response streams remain held for the test.</text></svg>